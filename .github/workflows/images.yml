# On pushes to main, build and push each image whose directory changed.
# Adding an image: add it to the loop in `job_changes` and give it a job like `job_web`.

name: Images

on:
  push:
    branches: [main]

jobs:
  job_changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      web: ${{ steps.step_diff.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, to diff against the previous tip of main

      # Without a previous commit to diff against (first push, or a force push that dropped
      # it), every image counts as changed.
      - id: step_diff
        env:
          BEFORE: ${{ github.event.before }} # SHA main pointed to before this push
        run: |
          if changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" 2>/dev/null); then
            all=false
          else
            all=true
          fi
          for image in web; do
            if [ "$all" = true ] || grep -q "^$image/" <<<"$changed"; then
              echo "$image=true" >> "$GITHUB_OUTPUT"
            fi
          done

  job_web:
    needs: job_changes
    if: needs.job_changes.outputs.web == 'true'
    uses: ./.github/workflows/push-image.yml
    permissions:
      id-token: write
      contents: read
    with:
      image: web
