# Build an image from <image>/Dockerfile and push it to ECR, tagged with the SHA of the last
# commit that changed <image>/, so commits that don't touch an image reuse its existing tag.
# Called by other workflows (`uses: ./.github/workflows/push-image.yml`), which get the
# image URI back; or run by hand.

name: Push image

on:
  workflow_dispatch:
    inputs:
      image:
        description: Image to build (directory with a Dockerfile; ECR repo varpad/<image>)
        required: true
  workflow_call:
    inputs:
      image:
        type: string
        required: true
    outputs:
      image_uri:
        description: Pushed image, as <registry>/<repo>:<tag>
        value: ${{ jobs.job_push.outputs.image_uri }}

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::646323602481:role/varpad-github-actions
  IMAGE: ${{ inputs.image }}

jobs:
  job_push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for the AWS role
      contents: read
    outputs:
      image_uri: ${{ steps.step_uri.outputs.image_uri }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, to find the last commit that changed the image

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: step_ecr
        uses: aws-actions/amazon-ecr-login@v2

      - id: step_uri
        run: |
          tag=$(git log -1 --format=%H -- "$IMAGE/")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image_uri=${{ steps.step_ecr.outputs.registry }}/varpad/$IMAGE:$tag" >> "$GITHUB_OUTPUT"

      # Tags are immutable, so an image already pushed for this tag is reused.
      - id: step_exists
        run: |
          if aws ecr describe-images --repository-name "varpad/$IMAGE" \
              --image-ids imageTag="${{ steps.step_uri.outputs.tag }}" >/dev/null 2>&1; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.step_exists.outputs.pushed != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.IMAGE }}
          platforms: linux/amd64 # matches the instance type (t3a)
          push: true
          tags: ${{ steps.step_uri.outputs.image_uri }}
